<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #ffffff;
  }

  .tables-wrapper {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .table-block {
    flex: 1;
    min-width: 340px;
  }

  .table-title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 10px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th, td {
    border: 1px solid #000;
    padding: 8px 10px;
    text-align: left;
    font-size: 15px;
  }

  th {
    font-weight: normal;
  }

  td:first-child, th:first-child {
    font-weight: normal;
  }
</style>
</head>
<body>

<div class="tables-wrapper">

  <div class="table-block">
    <div class="table-title">Subject-Specific Study Guides (IAL) </div>
    <table>
      <tr>
        <th>Units/Sub</th>
        <th>Mathematics</th>
        <th>Physics</th>
        <th>Biology</th>
        <th>Chemistry</th>
      </tr>
      <tr><td>Unit-1</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-2</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-3</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-4</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-5</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-6</td><td></td><td></td><td></td><td></td></tr>
    </table>
  </div>

  <div class="table-block">
    <div class="table-title">Rapid Revision Summaries (IAL) </div>
    <table>
      <tr>
        <th>Units/Sub</th>
        <th>Mathematics</th>
        <th>Physics</th>
        <th>Biology</th>
        <th>Chemistry</th>
      </tr>
      <tr><td>Unit-1</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-2</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-3</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-4</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-5</td><td></td><td></td><td></td><td></td></tr>
      <tr><td>Unit-6</td><td></td><td></td><td></td><td></td></tr>

  </div>

</div>

</body>
</html>
